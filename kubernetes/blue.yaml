apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-blue
  namespace: bluegreen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen
      slot: blue
  template:
    metadata:
      labels:
        app: bluegreen
        slot: blue
    spec:
      containers:
      - name: bluegreen-app
        image: bluegreen-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: COLOR
          value: BLUE
        - name: APP_VERSION
          value: "1.0"
        - name: BUILD_NUMBER
          value: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
